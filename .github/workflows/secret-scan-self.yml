name: Secret Scan (self)

# Caller propio del reusable de este mismo repo — plan merge-queue-global,
# F5.0. secret-scan.yml (en este repo) ES la definicion del reusable
# (`on: workflow_call` unicamente): no se auto-escanea. Agregarle triggers
# directamente lo haria correr standalone y el contexto emitido seria
# "trufflehog" (el nombre del job), no "scan / trufflehog" — inconsistente
# con el resto de la org, que consume el reusable via un job llamado `scan`.
# Este caller invoca el reusable por ruta local con un job tambien llamado
# `scan`, para que el nombre del contexto quede identico al de los demas repos.
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# El bloque de permissions es obligatorio, no cosmetico (§5.3 del plan):
# default_workflow_permissions esta en `read` a nivel de org y de este repo, y
# un workflow llamado solo puede BAJAR los permisos del caller, nunca
# elevarlos. El reusable declara contents:read + issues:write en su job — sin
# este bloque aqui, el run puede fallar en validacion y el check requerido
# quedar sin emisor.
permissions:
  contents: read
  issues: write

jobs:
  scan:
    uses: ./.github/workflows/secret-scan.yml

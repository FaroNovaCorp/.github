name: Dependabot Auto-merge

# Reusable workflow — aprieta el boton que Dependabot no aprieta.
#
# Merge Queue != auto-merge: la cola dice "es seguro mergear", esto dice
# "alguien quiere que esto entre". Sin este workflow no existe en ningun repo
# el paso que decide POR QUIEN se aprueba un PR de Dependabot.
#
# Criterio (decidido por David, TSK-20260812T055522-8dyl — no cambiar aqui,
# escalar si se cree que deberia ser otro):
#   - patch y minor -> entran solos. Actualizaciones de seguridad tambien,
#     SIEMPRE QUE no sean major (ver nota de desempate abajo).
#   - major -> se queda esperando a una persona. No se auto-mergea nunca.
#   - cualquier valor que NO sea explicitamente patch o minor (major, vacio,
#     desconocido, error del action) -> espera a una persona. Lista BLANCA,
#     no lista negra: fail-closed, no fail-open. Esto no es cosmetica —
#     una version anterior de este archivo comparaba
#     `update-type != semver-major`, que es cierto tambien cuando
#     `update-type` viene VACIO (dato empirico de BAR1: en esta org
#     `fetch-metadata` a veces no devuelve `update-type` en absoluto), asi que
#     esa version auto-mergeaba TODO, majors incluidos. Corregido antes de
#     probarlo contra un PR real — ver el paso "Log crudo" abajo, que deja el
#     valor LITERAL en el Job Summary para no repetir el error de confiar en
#     la documentacion en vez del dato real.
#
# DESEMPATE CONFIRMADO POR D-027 (David, 12-ago-2026): un bump de seguridad
# que ademas es major cae en las dos reglas de la frase original de David a
# la vez ("security entra sola" vs "major espera a una persona"). El default
# conservador que dejo la sesion maestra R19 el mismo dia (major manda
# SIEMPRE, tenga o no alerta de seguridad asociada) es EXACTAMENTE lo que
# D-027 confirmo — no hizo falta cambiar una linea de la logica, solo dejar
# de llamarlo "pendiente". La asimetria de riesgo que motivo el default sigue
# siendo la razon: un security-major retenido cuesta horas de espera; uno
# auto-mergeado que rompe produccion de madrugada, sin nadie mirando, cuesta
# mucho mas.
#
# Que pasa despues de quedar excluido (D-027): no se queda esperando a que
# alguien lo note. La pasada de `/merge-watchdog` (2x/dia, repo
# recursos-compartidos) lo resuelve en la misma corrida — Paso 2bis de
# `.claude/commands/merge-watchdog.md`: analiza los breaking changes contra
# el uso real, mergea con evidencia si no afecta, arregla y mergea si afecta,
# o deja una TSK con diagnostico + plan si el arreglo es grande. Un major SIN
# alerta de seguridad sigue esperando a una persona sin fecha limite (U9 de
# ese mismo comando).
#
# GRUPOS (Dependabot agrupa varias dependencias en un solo PR, ej.
# "security-npm"): un grupo se mergea ENTERO o no se mergea — si UNA sola
# dependencia del grupo es major, el grupo completo espera. Documentacion de
# `dependabot/fetch-metadata` dice que `update-type` es "el cambio semver mas
# alto" del PR, lo que ya cubriria esto — pero dado el hallazgo de BAR1 sobre
# `update-type` ausente en esta org, NO se asume: el paso "Log crudo" imprime
# tambien `updated-dependencies-json` completo (una entrada por dependencia,
# con su propio `update-type`) para poder confirmar con el dato real de un
# grupo mixto (caso conocido: `tablero-equipo#279` trae `vite` y `vitest`
# como majors dentro de un grupo "security-npm").
#
# Alcance: SOLO PRs de `dependabot[bot]`. Bots que no son Dependabot
# (ej. propagadores internos, workflows de sincronizacion) no tienen
# `update-type` semver y no los cubre este workflow — ver el caller de cada
# repo para saber si tienen su propio mecanismo.
#
# El caller debe disparar en `pull_request_target`, NUNCA en `pull_request`:
# Dependabot corre `pull_request` con un GITHUB_TOKEN de solo lectura, y
# habilitar auto-merge necesita escritura. `pull_request_target` corre con el
# contexto del repo base — por eso este job NUNCA hace checkout del codigo del
# PR (no hay ningun paso `actions/checkout` aqui, a proposito).

on:
  workflow_call:
    inputs:
      merge_method:
        description: >-
          Metodo para `gh pr merge`: merge, squash o rebase. Debe coincidir
          con lo que el repo caller tiene habilitado
          (Settings > General > Pull Requests) o el comando falla.
        required: false
        type: string
        default: "merge"
      wait_timeout_minutes:
        description: >-
          Minutos que este job espera a que los checks REQUERIDOS del PR
          resuelvan antes de habilitar auto-merge (D-1275 — ver nota en el
          step "Esperar checks..."). Default cubre lo medido (mediana ~70s,
          outlier ~8.5min en agente-de-monitoreo, reporte
          MW-20260926-0845) con margen. Repos con CI mas lenta pueden subirlo.
        required: false
        type: number
        default: 20

jobs:
  automerge:
    # Gate mas importante del archivo: pull_request_target dispara para
    # CUALQUIER PR (tambien los de personas). Sin este `if`, el job entero
    # correria contra PRs humanos. Para un dev, "sin auto-merge" es
    # informacion ("todavia no"), no un hueco — nunca tocarlos.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      # `checks: read` + `statuses: read`: el nuevo step llama `gh pr
      # checks`, que lee check-runs y commit-statuses -- con `permissions:`
      # declarado, todo lo omitido queda en `none` (hallazgo de /revisar-pr
      # #19: sin esto, `gh pr checks` puede fallar con "Resource not
      # accessible by integration"). Solo lectura, no amplia nada.
      checks: read
      statuses: read

    steps:
      - name: Metadata de Dependabot
        id: metadata
        # Pin a SHA, siempre (estandar de la casa) -- v2 es un tag movil.
        # Aca importa mas que en la mayoria: el gate SI auto-mergea hoy
        # (patch/minor de un solo paquete, rutinariamente) -- lo que nunca
        # hace es dejar pasar un major, por el fail-closed de `update-type`
        # vacio (ver nota mas abajo). Una v2.x futura que arreglara ese
        # parseo encenderia el auto-merge de majors SOLO, en todos los
        # callers de este reusable a la vez, sin un PR ni un review de por
        # medio. Pinear restringe -- no amplia nada; un bump de version
        # sigue siendo tan facil como cambiar este SHA a proposito.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          # alert-lookup habilita el output `ghsa-id`: sin esto no hay forma
          # de distinguir "bump major porque si" de "bump major porque el fix
          # de seguridad solo existe en esa version" — y el criterio de David
          # exige tratarlos distinto.
          alert-lookup: true

      - name: Log crudo (evidencia — NO confiar en la doc, mirar el dato real)
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          GHSA_ID: ${{ steps.metadata.outputs.ghsa-id }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          {
            echo "## fetch-metadata — valores literales"
            echo '```'
            echo "update-type: '${UPDATE_TYPE}'"
            echo "dependency-names: '${DEP_NAMES}'"
            echo "directory: '${DIRECTORY}'"
            echo "ghsa-id: '${GHSA_ID}'"
            echo "updated-dependencies-json:"
            echo "${DEPS_JSON}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::update-type='${UPDATE_TYPE}' dependency-names='${DEP_NAMES}'"

      - name: Decidir elegibilidad
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          GHSA_ID: ${{ steps.metadata.outputs.ghsa-id }}
        run: |
          # LISTA BLANCA explicita, no lista negra — ver nota arriba sobre por
          # que (`!= major` es fail-open cuando update-type viene vacio).
          # Cualquier valor que no sea EXACTAMENTE patch o minor espera a una
          # persona: major, vacio, desconocido, o un error del action. El
          # RESULTADO (eligible=true/false) es identico al de antes de D-027
          # para TODO valor de UPDATE_TYPE — lo unico que cambia es el
          # `::notice::` de la rama major, para distinguir el caso
          # security-major (D-027: lo resuelve /merge-watchdog, no espera
          # indefinidamente) del major sin seguridad asociada (sigue
          # esperando a una persona, sin cambios).
          case "${UPDATE_TYPE}" in
            version-update:semver-patch|version-update:semver-minor)
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Elegible para auto-merge (update-type=${UPDATE_TYPE})."
              ;;
            version-update:semver-major)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              if [ -n "${GHSA_ID}" ]; then
                echo "::notice::NO elegible — security-major (update-type=${UPDATE_TYPE}, ghsa-id=${GHSA_ID}). D-027: lo resuelve /merge-watchdog en su proxima pasada (Paso 2bis de merge-watchdog.md), no espera a una persona sin fecha."
              else
                echo "::notice::NO elegible — major sin alerta de seguridad asociada (update-type=${UPDATE_TYPE}). Espera a una persona (U9 de /merge-watchdog)."
              fi
              ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "::notice::NO elegible — update-type='${UPDATE_TYPE}' (ghsa-id=${GHSA_ID:-ninguno}) no esta en la lista blanca (patch/minor). Se deja para revision humana."
              ;;
          esac

      - name: Esperar checks y habilitar auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge_method }}
          WAIT_MINUTES: ${{ inputs.wait_timeout_minutes }}
        # D-1275/D-1287 (medido en #431 agente-conversacional y #349 landing,
        # 26-sep-2026, timeline GraphQL + check-runs de los dos PR): en un
        # repo con Merge Queue, `GITHUB_TOKEN` NO PUEDE encolar un PR -- causa
        # confirmada por GitHub Docs, "Automating Dependabot with GitHub
        # Actions": "If the target branch uses a merge queue, the built-in
        # GITHUB_TOKEN cannot add pull requests to the queue." `gh pr merge
        # --auto` arma el flag (eso si lo permite el token) pero la
        # conversion flag -> cola nunca ocurre: el PR queda con
        # autoMergeRequest activo, checks requeridos en SUCCESS, y el
        # timeline de merge_group VACIO para siempre -- confirmado 2/2, sin
        # que ayude esperar mas tiempo.
        #
        # Por diseno (D-1287, decision de David): este step NUNCA hace un
        # merge/encolado EXPLICITO propio -- "Que NO" del brief D-1275, nada
        # de `gh pr merge --merge`/`--squash`/`--rebase` sin `--auto`, nunca
        # `--admin`. Solo se llama `gh pr merge --auto`, que puede resolver
        # de inmediato si el PR YA cumple todo (comportamiento documentado y
        # normal de GitHub en un repo SIN Merge Queue -- no es un bypass
        # nuestro); en un repo CON Merge Queue es exactamente el mismo caso
        # que hoy se atasca, asi que la resolucion real de ese atasco la hace
        # `/merge-watchdog` con identidad humana (Paso 2ter, D-1287, ver
        # merge-watchdog.md). Lo que este step aporta:
        # (1) esperar a que los checks REQUERIDOS resuelvan antes de pedir el
        # auto-merge, en vez de pedirlo a ciegas segundos despues de abrir el
        # PR -- deja el caso "no elegible por checks aun pendientes" separado
        # del caso "elegible pero estructuralmente atascado"; (2) vigilar
        # unos minutos si de todos modos se completo (repos SIN Merge Queue
        # si pueden terminar solos via GITHUB_TOKEN) -- si no, fallar este
        # step para dejar rastro visible en la pestaña Checks del PR en vez
        # de silencio durante dias, como paso con #431/#349 antes de este
        # fix. Este job ("automerge") no esta en el `required_status_checks`
        # de ningun repo consumidor hoy (verificado en agente-conversacional
        # y landing) -- si algun repo lo agrega como requerido a futuro, esta
        # falla SI bloquearia el merge; confirmarlo en el ruleset del repo
        # antes de asumirlo.
        run: |
          # `-e` OFF a proposito: el shell default de un `run:` en Actions es
          # `bash --noprofile --norc -eo pipefail {0}` -- con `-e` heredado,
          # un `timeout ... gh pr checks` en rojo aborta el script ANTES de
          # `CHECKS_EXIT=$?` y antes de habilitar auto-merge, saltandose la
          # rama que maneja checks fallidos/timeout por completo (hallazgo
          # CRITICO de /revisar-pr #19, reproducido con `bash -e` real:
          # con `-e` solo corrio `gh pr checks`; sin `-e`, corrio tambien
          # `gh pr merge`). `set -uo pipefail` NO apaga `-e` -- hay que
          # apagarla explicito.
          set +e
          set -uo pipefail

          # Ventana de gracia y polling parametrizados por env var (no por
          # input del workflow_call -- son detalle interno) solo para que
          # `.github/tests/dependabot-automerge.bats` los pueda achicar; en
          # produccion siempre corren con el default.
          GRACE_SECONDS="${GRACE_SECONDS:-300}"
          GRACE_POLL_SECONDS="${GRACE_POLL_SECONDS:-20}"
          case "${GRACE_SECONDS}" in ''|*[!0-9]*) echo "::error::GRACE_SECONDS invalido: '${GRACE_SECONDS}'"; exit 1 ;; esac
          case "${GRACE_POLL_SECONDS}" in ''|*[!0-9]*|0) echo "::error::GRACE_POLL_SECONDS invalido (entero > 0): '${GRACE_POLL_SECONDS}'"; exit 1 ;; esac

          timeout "${WAIT_MINUTES}m" gh pr checks "$PR_URL" --watch --required --fail-fast --interval 15
          CHECKS_EXIT=$?

          if [ "${CHECKS_EXIT}" -ne 0 ]; then
            echo "::notice::Checks requeridos no resolvieron en verde dentro de ${WAIT_MINUTES}min (exit=${CHECKS_EXIT}). Habilito auto-merge igual -- sin cambios de comportamiento: espera a que resuelvan solos o a una persona."
            if ! gh pr merge --auto --"${MERGE_METHOD}" "$PR_URL"; then
              echo "::error::gh pr merge --auto fallo -- auto-merge NO quedo habilitado (permisos, metodo invalido, o error de API). Hallazgo confirmado 3/3 en /revisar-pr #19: bajo 'set +e', un fallo aca antes se tragaba en silencio."
              exit 1
            fi
            exit 0
          fi

          # `if ! gh ...; then exit 1; fi`, no una llamada suelta: bajo
          # `set +e` una llamada suelta no verificada se traga cualquier
          # fallo en silencio -- confirmado 3/3 en /revisar-pr #19 (los tres
          # revisores lo reprodujeron con exit codes reales del `gh` real).
          if ! gh pr merge --auto --"${MERGE_METHOD}" "$PR_URL"; then
            echo "::error::gh pr merge --auto fallo -- auto-merge NO quedo habilitado (permisos, metodo invalido, o error de API). No tiene sentido vigilar algo que nunca se armo."
            exit 1
          fi

          # Ventana corta de vigilancia -- sin forzar nada (ver nota arriba).
          # `state` sola no alcanza: un PR ya admitido a la cola sigue en
          # OPEN hasta que el grupo termine de mergear (medido: mediana ~70s,
          # outlier ~8.5min, reporte MW-20260926-0845) -- marcarlo "atascado"
          # ahi seria un falso positivo (hallazgo ALTO de /revisar-pr #19).
          # `isInMergeQueue` (GraphQL) distingue "progresando en la cola" de
          # "nunca entro".
          # OBSERVED_OK distingue "confirme que sigue sin cola" de "nunca
          # pude ver el estado" (hallazgo MEDIO/ALTO de /revisar-pr #19,
          # ronda 2: una caida persistente de `gh api graphql`/`jq` durante
          # TODA la ventana no debe diagnosticarse como el bug D-1275/D-1287
          # -- es una falla de observacion distinta).
          OBSERVED_OK=false
          IN_QUEUE=false
          GRACE_DEADLINE=$(( $(date +%s) + GRACE_SECONDS ))
          while [ "$(date +%s)" -lt "${GRACE_DEADLINE}" ]; do
            READ_ERR="$(mktemp)"
            # $url es variable GraphQL, no de bash -- no debe expandirse aca, viaja por `-f url=`.
            # shellcheck disable=SC2016
            PR_JSON=$(gh api graphql -f query='query($url:URI!){ resource(url:$url){ ... on PullRequest { state isInMergeQueue } } }' -f url="$PR_URL" 2>"$READ_ERR")
            GH_EXIT=$?
            if [ "${GH_EXIT}" -ne 0 ]; then
              echo "::warning::gh api graphql fallo consultando estado del PR (exit=${GH_EXIT}): $(cat "$READ_ERR")"
              rm -f "$READ_ERR"
              sleep "${GRACE_POLL_SECONDS}"
              continue
            fi
            rm -f "$READ_ERR"
            STATE=$(echo "${PR_JSON}" | jq -r '.data.resource.state // "UNKNOWN"')
            JQ_STATE_EXIT=$?
            IN_QUEUE=$(echo "${PR_JSON}" | jq -r '.data.resource.isInMergeQueue // false')
            JQ_QUEUE_EXIT=$?
            if [ "${JQ_STATE_EXIT}" -ne 0 ] || [ "${JQ_QUEUE_EXIT}" -ne 0 ]; then
              echo "::warning::respuesta de gh api graphql no es el JSON esperado -- jq fallo (state_exit=${JQ_STATE_EXIT}, queue_exit=${JQ_QUEUE_EXIT})."
              sleep "${GRACE_POLL_SECONDS}"
              continue
            fi
            OBSERVED_OK=true
            if [ "${STATE}" = "MERGED" ]; then
              echo "::notice::Mergeado (via auto-merge/cola) dentro de la ventana de gracia."
              exit 0
            fi
            if [ "${IN_QUEUE}" = "true" ]; then
              echo "::notice::En Merge Queue, progresando -- no es el bug D-1275/D-1287. Sigo vigilando."
            fi
            sleep "${GRACE_POLL_SECONDS}"
          done

          if [ "${IN_QUEUE}" = "true" ]; then
            echo "::notice::Sigue en Merge Queue al cierre de la ventana de gracia (${GRACE_SECONDS}s) -- progresando, no es el bug. No alerto."
            exit 0
          fi

          if [ "${OBSERVED_OK}" != "true" ]; then
            echo "::error title=No pude observar el estado del PR::gh api graphql fallo durante toda la ventana de gracia (${GRACE_SECONDS}s) -- no hay evidencia para diagnosticar D-1275/D-1287 ni para descartarlo. Revisar manualmente: ${PR_URL}"
            {
              echo "## Vigilancia sin observacion -- no es un diagnostico de D-1275/D-1287"
              echo "gh api graphql fallo en cada intento durante ${GRACE_SECONDS}s. Revisar manualmente: \`gh pr view ${PR_URL}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::error title=Auto-merge armado sin completar (D-1275/D-1287)::Checks requeridos en verde, auto-merge habilitado hace >${GRACE_SECONDS}s, PR sin mergear ni encolar -- GITHUB_TOKEN no puede encolar en Merge Queue (causa confirmada, ver comentario del step). Lo resuelve /merge-watchdog (Paso 2ter, identidad humana) en su proxima pasada, o gh pr merge --${MERGE_METHOD} manual: ${PR_URL}"
          {
            echo "## D-1275/D-1287 -- auto-merge armado, sin completar"
            echo "Checks requeridos en verde. Auto-merge habilitado hace mas de ${GRACE_SECONDS}s."
            echo "GITHUB_TOKEN no puede encolar en Merge Queue -- causa confirmada (GitHub Docs, Automating Dependabot with GitHub Actions), no es un caso aislado."
            echo "Lo resuelve /merge-watchdog (Paso 2ter, D-1287) en su proxima pasada, o \`gh pr merge --${MERGE_METHOD} ${PR_URL}\` manual."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

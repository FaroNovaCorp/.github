name: Dependabot Auto-merge

# Reusable workflow — aprieta el boton que Dependabot no aprieta.
#
# Merge Queue != auto-merge: la cola dice "es seguro mergear", esto dice
# "alguien quiere que esto entre". Sin este workflow no existe en ningun repo
# el paso que decide POR QUIEN se aprueba un PR de Dependabot.
#
# Criterio (decidido por David, TSK-20260812T055522-8dyl — no cambiar aqui,
# escalar si se cree que deberia ser otro):
#   - patch y minor -> entran solos. Actualizaciones de seguridad tambien,
#     SIEMPRE QUE no sean major (ver nota de desempate abajo).
#   - major -> se queda esperando a una persona. No se auto-mergea nunca.
#   - cualquier valor que NO sea explicitamente patch o minor (major, vacio,
#     desconocido, error del action) -> espera a una persona. Lista BLANCA,
#     no lista negra: fail-closed, no fail-open. Esto no es cosmetica —
#     una version anterior de este archivo comparaba
#     `update-type != semver-major`, que es cierto tambien cuando
#     `update-type` viene VACIO (dato empirico de BAR1: en esta org
#     `fetch-metadata` a veces no devuelve `update-type` en absoluto), asi que
#     esa version auto-mergeaba TODO, majors incluidos. Corregido antes de
#     probarlo contra un PR real — ver el paso "Log crudo" abajo, que deja el
#     valor LITERAL en el Job Summary para no repetir el error de confiar en
#     la documentacion en vez del dato real.
#
# DESEMPATE CONFIRMADO POR D-027 (David, 12-ago-2026): un bump de seguridad
# que ademas es major cae en las dos reglas de la frase original de David a
# la vez ("security entra sola" vs "major espera a una persona"). El default
# conservador que dejo la sesion maestra R19 el mismo dia (major manda
# SIEMPRE, tenga o no alerta de seguridad asociada) es EXACTAMENTE lo que
# D-027 confirmo — no hizo falta cambiar una linea de la logica, solo dejar
# de llamarlo "pendiente". La asimetria de riesgo que motivo el default sigue
# siendo la razon: un security-major retenido cuesta horas de espera; uno
# auto-mergeado que rompe produccion de madrugada, sin nadie mirando, cuesta
# mucho mas.
#
# Que pasa despues de quedar excluido (D-027): no se queda esperando a que
# alguien lo note. La pasada de `/merge-watchdog` (2x/dia, repo
# recursos-compartidos) lo resuelve en la misma corrida — Paso 2bis de
# `.claude/commands/merge-watchdog.md`: analiza los breaking changes contra
# el uso real, mergea con evidencia si no afecta, arregla y mergea si afecta,
# o deja una TSK con diagnostico + plan si el arreglo es grande. Un major SIN
# alerta de seguridad sigue esperando a una persona sin fecha limite (U9 de
# ese mismo comando).
#
# GRUPOS (Dependabot agrupa varias dependencias en un solo PR, ej.
# "security-npm"): un grupo se mergea ENTERO o no se mergea — si UNA sola
# dependencia del grupo es major, el grupo completo espera. Documentacion de
# `dependabot/fetch-metadata` dice que `update-type` es "el cambio semver mas
# alto" del PR, lo que ya cubriria esto — pero dado el hallazgo de BAR1 sobre
# `update-type` ausente en esta org, NO se asume: el paso "Log crudo" imprime
# tambien `updated-dependencies-json` completo (una entrada por dependencia,
# con su propio `update-type`) para poder confirmar con el dato real de un
# grupo mixto (caso conocido: `tablero-equipo#279` trae `vite` y `vitest`
# como majors dentro de un grupo "security-npm").
#
# Alcance: SOLO PRs de `dependabot[bot]`. Bots que no son Dependabot
# (ej. propagadores internos, workflows de sincronizacion) no tienen
# `update-type` semver y no los cubre este workflow — ver el caller de cada
# repo para saber si tienen su propio mecanismo.
#
# El caller debe disparar en `pull_request_target`, NUNCA en `pull_request`:
# Dependabot corre `pull_request` con un GITHUB_TOKEN de solo lectura, y
# habilitar auto-merge necesita escritura. `pull_request_target` corre con el
# contexto del repo base — por eso este job NUNCA hace checkout del codigo del
# PR (no hay ningun paso `actions/checkout` aqui, a proposito).

on:
  workflow_call:
    inputs:
      merge_method:
        description: >-
          Metodo para `gh pr merge --auto`: merge, squash o rebase. Debe
          coincidir con lo que el repo caller tiene habilitado
          (Settings > General > Pull Requests) o el comando falla.
        required: false
        type: string
        default: "merge"

jobs:
  automerge:
    # Gate mas importante del archivo: pull_request_target dispara para
    # CUALQUIER PR (tambien los de personas). Sin este `if`, el job entero
    # correria contra PRs humanos. Para un dev, "sin auto-merge" es
    # informacion ("todavia no"), no un hueco — nunca tocarlos.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Metadata de Dependabot
        id: metadata
        # Pin a SHA, siempre (estandar de la casa) -- v2 es un tag movil.
        # Aca importa mas que en la mayoria: el gate SI auto-mergea hoy
        # (patch/minor de un solo paquete, rutinariamente) -- lo que nunca
        # hace es dejar pasar un major, por el fail-closed de `update-type`
        # vacio (ver nota mas abajo). Una v2.x futura que arreglara ese
        # parseo encenderia el auto-merge de majors SOLO, en todos los
        # callers de este reusable a la vez, sin un PR ni un review de por
        # medio. Pinear restringe -- no amplia nada; un bump de version
        # sigue siendo tan facil como cambiar este SHA a proposito.
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a  # v2.5.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          # alert-lookup habilita el output `ghsa-id`: sin esto no hay forma
          # de distinguir "bump major porque si" de "bump major porque el fix
          # de seguridad solo existe en esa version" — y el criterio de David
          # exige tratarlos distinto.
          alert-lookup: true

      - name: Log crudo (evidencia — NO confiar en la doc, mirar el dato real)
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          GHSA_ID: ${{ steps.metadata.outputs.ghsa-id }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          {
            echo "## fetch-metadata — valores literales"
            echo '```'
            echo "update-type: '${UPDATE_TYPE}'"
            echo "dependency-names: '${DEP_NAMES}'"
            echo "directory: '${DIRECTORY}'"
            echo "ghsa-id: '${GHSA_ID}'"
            echo "updated-dependencies-json:"
            echo "${DEPS_JSON}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::update-type='${UPDATE_TYPE}' dependency-names='${DEP_NAMES}'"

      - name: Decidir elegibilidad
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          GHSA_ID: ${{ steps.metadata.outputs.ghsa-id }}
        run: |
          # LISTA BLANCA explicita, no lista negra — ver nota arriba sobre por
          # que (`!= major` es fail-open cuando update-type viene vacio).
          # Cualquier valor que no sea EXACTAMENTE patch o minor espera a una
          # persona: major, vacio, desconocido, o un error del action. El
          # RESULTADO (eligible=true/false) es identico al de antes de D-027
          # para TODO valor de UPDATE_TYPE — lo unico que cambia es el
          # `::notice::` de la rama major, para distinguir el caso
          # security-major (D-027: lo resuelve /merge-watchdog, no espera
          # indefinidamente) del major sin seguridad asociada (sigue
          # esperando a una persona, sin cambios).
          case "${UPDATE_TYPE}" in
            version-update:semver-patch|version-update:semver-minor)
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Elegible para auto-merge (update-type=${UPDATE_TYPE})."
              ;;
            version-update:semver-major)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              if [ -n "${GHSA_ID}" ]; then
                echo "::notice::NO elegible — security-major (update-type=${UPDATE_TYPE}, ghsa-id=${GHSA_ID}). D-027: lo resuelve /merge-watchdog en su proxima pasada (Paso 2bis de merge-watchdog.md), no espera a una persona sin fecha."
              else
                echo "::notice::NO elegible — major sin alerta de seguridad asociada (update-type=${UPDATE_TYPE}). Espera a una persona (U9 de /merge-watchdog)."
              fi
              ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "::notice::NO elegible — update-type='${UPDATE_TYPE}' (ghsa-id=${GHSA_ID:-ninguno}) no esta en la lista blanca (patch/minor). Se deja para revision humana."
              ;;
          esac

      - name: Habilitar auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # En repos CON Merge Queue esto equivale a "Merge when ready" y
          # encola; el merge directo devuelve HTTP 405 y eso es lo esperado.
          gh pr merge --auto --${{ inputs.merge_method }} "$PR_URL"

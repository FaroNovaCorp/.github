name: Secret Scan

on:
  workflow_call:
    inputs:
      exclude_detectors:
        description: >-
          Lista separada por comas de detectores de TruffleHog a excluir.
          Ver la seccion "Detectores excluidos" abajo antes de agregar uno.
        required: false
        type: string
        default: "Lob"
      scan_mode:
        description: >-
          `auto` (default): escaneo INCREMENTAL del rango que aporta el PR o el
          grupo de la cola; escaneo COMPLETO del historial en cualquier otro
          evento (schedule, workflow_dispatch, push...). `full`: fuerza el
          escaneo completo. `incremental`: exige rango; si no lo hay, cae a
          completo y lo avisa. Ver "Modos de escaneo" abajo.
        required: false
        type: string
        default: "auto"

env:
  # Version fijada a proposito. `@main` es un ref flotante: cualquier cambio
  # upstream entra sin revision. Mismo criterio que la seccion de supply chain
  # de npm en CLAUDE.md. Para actualizar: subir la version aca, en un PR.
  TRUFFLEHOG_VERSION: "3.96.0"

# ---------------------------------------------------------------------------
# Detectores excluidos — por que, y que se pierde
# ---------------------------------------------------------------------------
# `Lob`  (excluido por defecto desde 2026-08-06)
#   Regex del detector:  \b((live|test)_[a-zA-Z0-9_]{35})\b
#   Eso matchea CUALQUIER identificador que empiece por `test_` y tenga
#   exactamente 35 caracteres mas — es decir, nombres de funciones de test de
#   Python. En `recursos-compartidos` matcheaba 11 de golpe, p.ej.
#   `test_clasificar_acepta_task_id_permitido`.
#
#   Y los marca como VERIFIED, que es lo que los hacia alarmantes. El verificador
#   de upstream hace `POST https://api.lob.com/v1/us_verifications` con body
#   vacio y trata el 422 como "llave activa, body invalido". Pero el body SIEMPRE
#   es invalido — lo manda vacio el propio detector — asi que cualquier candidato
#   "verifica". Es un bug de upstream, no de esta configuracion.
#
#   Que se pierde: la deteccion de llaves reales de Lob. FaroNova no usa Lob
#   (servicio de correo postal en EE.UU.), asi que el costo es cero. Si algun dia
#   se integra, quitar `Lob` de este default.
# ---------------------------------------------------------------------------
# Modos de escaneo — por que el default dejo de ser "todo el historial"
# ---------------------------------------------------------------------------
# Hasta 2026-08 este workflow corria `trufflehog git file:///repo` sin acotar el
# rango: eso escanea TODO el historial de commits del repo, en cada PR y en cada
# grupo de la cola. El costo crece de forma monotona con el repo y no depende de
# lo que el PR cambia. Medido en `agente-de-monitoreo` (25 runs reales, API de
# Actions):
#
#     Checkout (fetch-depth: 0) ......   8 s   <- NO es el problema
#     TruffleHog, historial completo .. 190 s  <- 94 % del job
#     Job facturado .................. 3,88 min/run  (ceil al minuto)
#
# Ojo con la intuicion facil: `fetch-depth: 0` NO es el costo. Clonar el
# historial cuesta 8 s; recorrerlo con ~800 detectores cuesta 190 s. Bajar el
# fetch-depth ahorraria segundos y romperia el calculo del rango (hace falta el
# commit base). Por eso sigue en 0 — es deliberado, no un descuido.
#
# En `auto`, el escaneo se acota al rango que el evento realmente aporta:
#
#     pull_request  ->  merge-base(base.sha, head.sha) .. head.sha
#     merge_group   ->  merge_group.base_sha .. merge_group.head_sha
#     resto         ->  historial completo (no hay rango derivable)
#
# Medido sobre el mismo repo: 59.426 chunks / 104 MB -> 6 chunks / 4,7 KB.
#
# QUE SIGUE CUBIERTO. El escaneo recorre los COMMITS del rango, no el diff de
# dos puntos ni el arbol final. Un secreto introducido en un commit intermedio
# del PR y borrado por un commit posterior SIGUE siendo detectado: esta en el
# historial, y el historial es lo que se publica al mergear. Verificado con un
# caso de prueba (secreto de juguete + verificador local que responde 200):
# `--since-commit BASE --branch HEAD` lo reporta en el commit intermedio y sale
# 183. Un escaneo del arbol de HEAD, en cambio, se lo pierde.
#
# QUE SE PIERDE. El barrido del historial VIEJO —secretos que ya estan mergeados
# en main desde antes del PR— deja de correr en cada PR. Eso NO desaparece: se
# mueve fuera del critical path. Cada caller debe agregar un trigger `schedule:`
# (semanal basta) que llame a este workflow; en un evento sin rango derivable el
# modo `auto` ya cae a completo, y al no ser un evento efimero abre un Issue
# con label `security,secrets` en vez de solo fallar un check. Coste: ~4 min por
# semana contra los ~3,9 min POR PR que costaba antes.
#
# FAIL-CLOSED. TruffleHog acepta un `--since-commit` invalido sin protestar:
# escanea 0 chunks y sale 0, o sea "limpio" (verificado en 3.96.0). Eso seria un
# fail-open en un gate de seguridad. Por eso el rango se valida en git ANTES de
# escanear (los dos commits existen, base es ancestro de head, el rango no esta
# vacio) y DESPUES se exige que el escaneo haya cubierto al menos un chunk. Si
# cualquiera de las dos falla, el modo cae a completo o el check falla — nunca
# pasa como limpio.
# ---------------------------------------------------------------------------

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Deliberado: hace falta el historial completo para calcular el
          # merge-base del rango, y para el barrido completo programado.
          # Medido en CI: 8 s. No es el cuello de botella (ver cabecera).
          fetch-depth: 0

      - name: Determinar el rango a escanear
        id: rango
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          set -uo pipefail

          # Rama local efimera que se le pasa a `--branch`. `--since-commit` sin
          # `--branch` NO acota: TruffleHog recorre igual los demas refs que
          # trajo el checkout (medido: 146 chunks contra 6). Hacen falta los dos.
          SCAN_BRANCH="trufflehog-rango-a-escanear"

          completo() {
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "commits=0" >> "$GITHUB_OUTPUT"
            echo "Modo COMPLETO (historial entero): $1"
          }

          if [ "${SCAN_MODE}" = "full" ]; then
            completo "el caller pidio scan_mode=full"
            exit 0
          fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request|pull_request_target)
              BASE_REF_SHA=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
              HEAD_SHA=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")
              ;;
            merge_group)
              BASE_REF_SHA=$(jq -r '.merge_group.base_sha // empty' "$GITHUB_EVENT_PATH")
              HEAD_SHA=$(jq -r '.merge_group.head_sha // empty' "$GITHUB_EVENT_PATH")
              ;;
            *)
              # schedule, workflow_dispatch, push... No hay un "lo que este
              # evento agrega" bien definido, asi que se escanea todo. Este es
              # el camino del barrido completo programado.
              if [ "${SCAN_MODE}" = "incremental" ]; then
                echo "::warning::scan_mode=incremental pero el evento ${GITHUB_EVENT_NAME} no define un rango. Se escanea el historial completo."
              fi
              completo "el evento ${GITHUB_EVENT_NAME} no define un rango"
              exit 0
              ;;
          esac

          # --- Validacion en git ANTES de escanear. Todo lo que no se pueda
          # --- probar cae a escaneo completo: mas caro, nunca menos seguro.
          if [ -z "${BASE_REF_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            completo "el payload de ${GITHUB_EVENT_NAME} no trajo base/head"
            exit 0
          fi
          if ! git cat-file -e "${BASE_REF_SHA}^{commit}" 2>/dev/null; then
            completo "el commit base ${BASE_REF_SHA} no esta en el checkout"
            exit 0
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            completo "el commit head ${HEAD_SHA} no esta en el checkout"
            exit 0
          fi

          # El punto de bifurcacion real, no la punta de la rama base: si main
          # avanzo durante el PR, `base.sha` ya no es ancestro de head y el
          # rango saldria mal.
          BASE=$(git merge-base "${BASE_REF_SHA}" "${HEAD_SHA}" 2>/dev/null)
          if [ -z "${BASE}" ]; then
            completo "no hay merge-base entre ${BASE_REF_SHA} y ${HEAD_SHA}"
            exit 0
          fi
          if ! git merge-base --is-ancestor "${BASE}" "${HEAD_SHA}" 2>/dev/null; then
            completo "${BASE} no es ancestro de ${HEAD_SHA}"
            exit 0
          fi

          COMMITS=$(git rev-list --count "${BASE}..${HEAD_SHA}" 2>/dev/null || echo 0)
          if [ "${COMMITS}" -eq 0 ]; then
            # Ni un PR ni un grupo de la cola aportan cero commits. Si pasa,
            # el rango esta mal calculado: se escanea todo.
            completo "el rango ${BASE}..${HEAD_SHA} esta vacio"
            exit 0
          fi

          git branch -f "${SCAN_BRANCH}" "${HEAD_SHA}"

          {
            echo "mode=incremental"
            echo "base=${BASE}"
            echo "head=${HEAD_SHA}"
            echo "branch=${SCAN_BRANCH}"
            echo "commits=${COMMITS}"
          } >> "$GITHUB_OUTPUT"

          echo "Modo INCREMENTAL: ${COMMITS} commit(s) en ${BASE}..${HEAD_SHA}"
          echo "Se recorren los commits del rango (no el diff de dos puntos):"
          echo "un secreto agregado y luego borrado dentro del PR sigue contando."

      - name: TruffleHog scan (verified secrets only)
        id: scan
        env:
          EXCLUDE_DETECTORS: ${{ inputs.exclude_detectors }}
          SCAN_MODE_EFECTIVO: ${{ steps.rango.outputs.mode }}
          RANGO_BASE: ${{ steps.rango.outputs.base }}
          RANGO_BRANCH: ${{ steps.rango.outputs.branch }}
          RANGO_COMMITS: ${{ steps.rango.outputs.commits }}
        run: |
          set -uo pipefail

          ARGS=(git file:///repo
                --only-verified
                --json
                --fail
                --no-update
                --exclude-detectors="${EXCLUDE_DETECTORS}")

          if [ "${SCAN_MODE_EFECTIVO}" = "incremental" ]; then
            ARGS+=(--since-commit "${RANGO_BASE}" --branch "${RANGO_BRANCH}")
            echo "Escaneo incremental: ${RANGO_COMMITS} commit(s) desde ${RANGO_BASE}"
          else
            echo "Escaneo completo del historial."
          fi

          # `--json` produce JSONL en stdout (una linea por hallazgo); los logs
          # van a stderr. OJO: `--results=json` NO es la forma de pedir JSON —
          # `--results` espera verified/unknown/unverified. Ese error era
          # justamente por lo que este workflow no podia decir QUE habia hallado.
          #
          # El `-e` de este step lo inyecta el runner (default de Actions para
          # steps `run:` sin `shell:` propio: `bash --noprofile --norc -eo
          # pipefail {0}`) — no aparece arriba, pero aplica igual. Sin el
          # `|| code=$?` de abajo, un exit no-cero de docker (183 = hallazgos,
          # cualquier otro = fallo de la herramienta) mata el script ANTES de
          # capturar el codigo: el case, el reporte, todo quedaba inalcanzable
          # (TSK-92lv — el gate bloqueaba pero era mudo). El `code=0` previo es
          # obligatorio, no cosmetico: sin el, `set -u` mata el caso limpio en
          # el `echo "exit_code=${code}"` de mas abajo, porque `code` nunca se
          # define cuando el `||` no dispara.
          code=0
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" \
            "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" \
            "${ARGS[@]}" \
            > "${RUNNER_TEMP}/trufflehog.jsonl" \
            2> "${RUNNER_TEMP}/trufflehog.err" || code=$?

          # --- Fail-closed: probar que el escaneo REALMENTE cubrio algo.
          # TruffleHog acepta un `--since-commit` invalido sin protestar: recorre
          # 0 chunks y sale 0, o sea "limpio". Sin esta comprobacion, cualquier
          # error de calculo del rango dejaria pasar un PR sin escanear y nadie
          # se enteraria. El resumen de la ultima linea de stderr trae `chunks`.
          CHUNKS=$(grep -o '"chunks":[0-9]*' "${RUNNER_TEMP}/trufflehog.err" \
                     | tail -1 | cut -d: -f2)
          CHUNKS="${CHUNKS:-0}"
          echo "chunks=${CHUNKS}" >> "$GITHUB_OUTPUT"

          if [ "${SCAN_MODE_EFECTIVO}" = "incremental" ] \
             && [ "${code}" -eq 0 ] && [ "${CHUNKS}" -eq 0 ]; then
            echo "::error::El escaneo incremental cubrio 0 chunks con ${RANGO_COMMITS} commit(s) en el rango. El rango se calculo mal; NO se puede afirmar que este limpio."
            code=99
          fi

          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

          # Contrato de salida de TruffleHog:
          #   0    -> limpio
          #   183  -> encontro resultados (por `--fail`)
          #   otro -> fallo la herramienta (args malos, red, docker, git...)
          case "${code}" in
            0)
              echo "result=clean" >> "$GITHUB_OUTPUT"
              echo "OK — sin secrets verificados (modo ${SCAN_MODE_EFECTIVO}, ${CHUNKS} chunks)."
              ;;
            183)
              echo "result=findings" >> "$GITHUB_OUTPUT"
              echo "TruffleHog reporto hallazgos. Ver el paso de reporte."
              ;;
            *)
              echo "result=tool_error" >> "$GITHUB_OUTPUT"
              echo "::error::El escaneo de secrets FALLO (exit ${code}). Esto NO significa que haya secrets: significa que no sabemos si los hay."
              tail -30 "${RUNNER_TEMP}/trufflehog.err" || true
              ;;
          esac
          exit 0

      - name: Reportar hallazgos
        if: steps.scan.outputs.result == 'findings' || steps.scan.outputs.result == 'tool_error'
        uses: actions/github-script@v7
        env:
          SCAN_RESULT: ${{ steps.scan.outputs.result }}
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
          SCAN_MODE_EFECTIVO: ${{ steps.rango.outputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.substring(0, 8);
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${context.sha}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = process.env.SCAN_RESULT;
            const tmp = process.env.RUNNER_TEMP;

            // Ramas efimeras de PR / Merge Queue: el ref cambia en cada intento
            // (`refs/pull/N/merge`, `gh-readonly-queue/main/pr-N-<sha>`), asi que
            // nunca hay un Issue estable que actualizar — y el required check
            // (via `core.setFailed` abajo) YA bloquea el merge. Abrir un Issue
            // por cada intento aqui era exactamente el ruido de esta tarea (11
            // Issues en 3 dias para 1 solo hallazgo subyacente). `eventName` es
            // mas confiable que parsear `context.ref` a mano.
            const isEphemeral = context.eventName === 'pull_request' || context.eventName === 'merge_group';

            // --- Caso 2: fallo la herramienta. NO es lo mismo que "hay secrets".
            if (result === 'tool_error') {
              let err = '';
              try {
                err = fs.readFileSync(path.join(tmp, 'trufflehog.err'), 'utf8').slice(-3000);
              } catch (e) { /* sin stderr */ }
              if (!isEphemeral) {
                const title = `El escaneo de secrets FALLO en ${repo} (branch: ${branch})`;
                const body = [
                  '## El escaneo de secrets no pudo completarse',
                  '',
                  '**Esto NO significa que se hayan encontrado secrets.** Significa que el escaneo',
                  'no corrio, asi que **no sabemos** si los hay. Hay que arreglar el escaneo.',
                  '',
                  `**Repositorio:** \`${owner}/${repo}\``,
                  `**Branch:** \`${branch}\``,
                  `**Commit:** [${sha}](${commitUrl})`,
                  `**Run:** ${runUrl}`,
                  `**Exit code de TruffleHog:** \`${process.env.SCAN_EXIT}\``,
                  '',
                  '### Salida de error',
                  '',
                  '```',
                  err || '(sin stderr capturado)',
                  '```',
                ].join('\n');
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['security', 'ci'],
                });
              } else {
                await core.summary
                  .addHeading('El escaneo de secrets fallo (sin Issue — rama efimera)')
                  .addRaw(
                    `Exit code de TruffleHog: \`${process.env.SCAN_EXIT}\`. No se abre Issue por ser ` +
                    `un run de \`${context.eventName}\`; el required check ya bloquea el merge.\n\n` +
                    '```\n' + (err || '(sin stderr capturado)') + '\n```'
                  )
                  .write();
              }
              core.setFailed(`El escaneo de secrets fallo con exit ${process.env.SCAN_EXIT}`);
              return;
            }

            // --- Caso 1: hay hallazgos. Reportar QUE y DONDE.
            let raw = '';
            try {
              raw = fs.readFileSync(path.join(tmp, 'trufflehog.jsonl'), 'utf8');
            } catch (e) { /* sin archivo */ }

            const findings = raw.split('\n')
              .map(l => l.trim()).filter(Boolean)
              .map(l => { try { return JSON.parse(l); } catch (e) { return null; } })
              .filter(Boolean);

            // Exit 183 = TruffleHog reporto hallazgos, pero si ninguna linea del
            // JSONL se pudo parsear no hay nada que mostrar — y NO es lo mismo
            // que "limpio". Antes esto quedaba en warning sin fallar el check
            // (fail-open: un hallazgo confirmado por la herramienta podia colar
            // un merge). Se trata igual que `tool_error`: no se abre Issue (no
            // hay detalle verificable que reportar) pero el check SI falla.
            if (findings.length === 0) {
              core.warning('TruffleHog salio 183 pero no se pudo parsear ningun hallazgo. No se abre Issue, pero el check falla (fail-closed).');
              core.setFailed('TruffleHog reporto hallazgos (exit 183) pero el JSONL no se pudo parsear — no se puede confirmar que no haya secrets. Revisa los logs del paso de scan.');
              return;
            }

            // Nunca pegar el secreto completo en un Issue.
            const redact = (s) => {
              if (!s) return '(vacio)';
              const t = String(s);
              if (t.length <= 12) return `${t.slice(0, 2)}${'*'.repeat(6)}`;
              return `${t.slice(0, 4)}${'*'.repeat(8)}${t.slice(-4)}`;
            };

            const rows = findings.map(f => {
              const g = (f.SourceMetadata && f.SourceMetadata.Data && f.SourceMetadata.Data.Git) || {};
              const fsm = (f.SourceMetadata && f.SourceMetadata.Data && f.SourceMetadata.Data.Filesystem) || {};
              return {
                detector: f.DetectorName || 'desconocido',
                verified: f.Verified === true,
                file: g.file || fsm.file || '(desconocido)',
                line: (g.line !== undefined ? g.line : (fsm.line !== undefined ? fsm.line : '?')),
                // `commit` es el SHA corto SOLO para mostrar en la tabla. El
                // fingerprint (mas abajo) usa `commitFull` — truncar a 8 chars
                // ahi reduciria el espacio de identidad del hallazgo y podria
                // deduplicar dos commits distintos con el mismo prefijo.
                commit: g.commit ? String(g.commit).substring(0, 8) : '-',
                commitFull: g.commit || '-',
                redacted: redact(f.Raw),
              };
            });

            const verifiedCount = rows.filter(r => r.verified).length;

            const detail = [
              '| # | Detector | Verificado | Archivo | Linea | Commit | Coincidencia (redactada) |',
              '|---|---|:---:|---|---:|---|---|',
              ...rows.map((r, i) =>
                `| ${i + 1} | \`${r.detector}\` | ${r.verified ? 'si' : '-'} | \`${r.file}\` | ${r.line} | \`${r.commit}\` | \`${r.redacted}\` |`),
            ].join('\n');

            // Fingerprint del hallazgo REAL (detector+file+line+commit), no del
            // titulo. El titulo anterior incluia la rama, y en Merge Queue/PR la
            // rama es distinta en cada intento — asi el dedup nunca coincidia
            // entre corridas aunque el hallazgo subyacente fuera el mismo (root
            // cause de esta tarea). El fingerprint se ordena para que el mismo
            // conjunto de hallazgos produzca el mismo hash sin importar el orden
            // en que TruffleHog los reporte.
            const fingerprintInput = rows
              .map(r => `${r.detector}|${r.file}|${r.line}|${r.commitFull}`)
              .sort()
              .join('\n');
            const fingerprint = crypto.createHash('sha256').update(fingerprintInput).digest('hex').slice(0, 16);
            const fingerprintMarker = `<!-- secret-scan-fingerprint: ${fingerprint} -->`;

            if (isEphemeral) {
              // El required check (via `core.setFailed` abajo) YA bloquea el
              // merge y el detalle queda en el Job Summary de este run — abrir
              // un Issue por cada intento de PR/merge-queue seria el mismo
              // ruido que origino esta tarea.
              await core.summary
                .addHeading(`Secrets detectados (${findings.length} hallazgo(s), ${verifiedCount} verificado(s))`)
                .addRaw(`Sin Issue — run de \`${context.eventName}\`. El required check bloquea el merge.\n\n${detail}`)
                .write();
              core.setFailed(
                `${findings.length} hallazgo(s) de secrets (${verifiedCount} verificado(s)) — ver el Job ` +
                `Summary de este run. No se abre Issue por ser un run de ${context.eventName}.`
              );
              return;
            }

            const title = `Secrets detectados en ${repo} (branch: ${branch})`;

            // Dedup por fingerprint real, buscando en TODOS los Issues abiertos
            // con label `secrets` — no por titulo exacto (que dependia de la
            // rama y por eso nunca dedupeaba entre corridas de PR/merge-queue).
            // `github.paginate` recorre TODAS las paginas, no solo la primera
            // (con `per_page` fijo un fingerprint viejo en un Issue mas alla de
            // la primera pagina no se hubiera encontrado nunca).
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'security,secrets', per_page: 100,
            });
            const duplicate = existingIssues.find(i => i.body && i.body.includes(fingerprintMarker));
            if (duplicate) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: duplicate.number,
                body: [
                  `Nuevo escaneo con el MISMO hallazgo (fingerprint identico) — commit [${sha}](${commitUrl}), branch \`${branch}\`:`, '',
                  detail, '', `Run: ${runUrl}`,
                ].join('\n'),
              });
              core.setFailed(`${findings.length} hallazgo(s) — ya reportado en Issue #${duplicate.number} (comentario agregado)`);
              return;
            }

            for (const label of ['security', 'secrets']) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: label,
                  color: label === 'security' ? 'd73a4a' : 'fbca04',
                });
              } catch (e) { /* ya existe */ }
            }

            const lines = [
              '## Secrets detectados por TruffleHog',
              '',
              `**${findings.length} hallazgo(s)**, de los cuales **${verifiedCount} verificado(s)**.`,
              '',
              `**Repositorio:** \`${owner}/${repo}\``,
              `**Branch:** \`${branch}\``,
              `**Commit que disparo el escaneo:** [${sha}](${commitUrl})`,
              `**Run:** ${runUrl}`,
              '',
              '### Que se detecto y donde',
              '',
              detail,
              '',
              '> **El commit que disparo el escaneo no es necesariamente el que introdujo el',
              `> hallazgo.** Este run corrio en modo \`${process.env.SCAN_MODE_EFECTIVO}\`: \`full\` recorre todo el`,
              '> historial del repo; `incremental` recorre solo los commits que aporta el PR o el',
              '> grupo de la cola. Mira la columna **Commit** de la tabla para saber de donde',
              '> viene cada uno.',
              '',
              '### Que hacer',
              '',
              '1. **Confirmar que es real.** Revisa la coincidencia y el archivo. Si es un falso',
              '   positivo, agrega el detector a `exclude_detectors` **con la razon escrita** en',

name: Secret Scan

on:
  workflow_call:
    inputs:
      exclude_detectors:
        description: >-
          Lista separada por comas de detectores de TruffleHog a excluir.
          Ver la seccion "Detectores excluidos" abajo antes de agregar uno.
        required: false
        type: string
        default: "Lob"

env:
  # Version fijada a proposito. `@main` es un ref flotante: cualquier cambio
  # upstream entra sin revision. Mismo criterio que la seccion de supply chain
  # de npm en CLAUDE.md. Para actualizar: subir la version aca, en un PR.
  TRUFFLEHOG_VERSION: "3.96.0"

# ---------------------------------------------------------------------------
# Detectores excluidos — por que, y que se pierde
# ---------------------------------------------------------------------------
# `Lob`  (excluido por defecto desde 2026-08-06)
#   Regex del detector:  \b((live|test)_[a-zA-Z0-9_]{35})\b
#   Eso matchea CUALQUIER identificador que empiece por `test_` y tenga
#   exactamente 35 caracteres mas — es decir, nombres de funciones de test de
#   Python. En `recursos-compartidos` matcheaba 11 de golpe, p.ej.
#   `test_clasificar_acepta_task_id_permitido`.
#
#   Y los marca como VERIFIED, que es lo que los hacia alarmantes. El verificador
#   de upstream hace `POST https://api.lob.com/v1/us_verifications` con body
#   vacio y trata el 422 como "llave activa, body invalido". Pero el body SIEMPRE
#   es invalido — lo manda vacio el propio detector — asi que cualquier candidato
#   "verifica". Es un bug de upstream, no de esta configuracion.
#
#   Que se pierde: la deteccion de llaves reales de Lob. FaroNova no usa Lob
#   (servicio de correo postal en EE.UU.), asi que el costo es cero. Si algun dia
#   se integra, quitar `Lob` de este default.
# ---------------------------------------------------------------------------

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan (verified secrets only)
        id: scan
        env:
          EXCLUDE_DETECTORS: ${{ inputs.exclude_detectors }}
        run: |
          set -uo pipefail

          # `--json` produce JSONL en stdout (una linea por hallazgo); los logs
          # van a stderr. OJO: `--results=json` NO es la forma de pedir JSON —
          # `--results` espera verified/unknown/unverified. Ese error era
          # justamente por lo que este workflow no podia decir QUE habia hallado.
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" \
            "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" \
            git file:///repo \
            --only-verified \
            --json \
            --fail \
            --no-update \
            --exclude-detectors="${EXCLUDE_DETECTORS}" \
            > "${RUNNER_TEMP}/trufflehog.jsonl" \
            2> "${RUNNER_TEMP}/trufflehog.err"
          code=$?

          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

          # Contrato de salida de TruffleHog:
          #   0    -> limpio
          #   183  -> encontro resultados (por `--fail`)
          #   otro -> fallo la herramienta (args malos, red, docker, git...)
          case "${code}" in
            0)
              echo "result=clean" >> "$GITHUB_OUTPUT"
              echo "OK — sin secrets verificados."
              ;;
            183)
              echo "result=findings" >> "$GITHUB_OUTPUT"
              echo "TruffleHog reporto hallazgos. Ver el paso de reporte."
              ;;
            *)
              echo "result=tool_error" >> "$GITHUB_OUTPUT"
              echo "::error::El escaneo de secrets FALLO (exit ${code}). Esto NO significa que haya secrets: significa que no sabemos si los hay."
              tail -30 "${RUNNER_TEMP}/trufflehog.err" || true
              ;;
          esac
          exit 0

      - name: Reportar hallazgos
        if: steps.scan.outputs.result == 'findings' || steps.scan.outputs.result == 'tool_error'
        uses: actions/github-script@v7
        env:
          SCAN_RESULT: ${{ steps.scan.outputs.result }}
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.substring(0, 8);
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${context.sha}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = process.env.SCAN_RESULT;
            const tmp = process.env.RUNNER_TEMP;

            // Ramas efimeras de PR / Merge Queue: el ref cambia en cada intento
            // (`refs/pull/N/merge`, `gh-readonly-queue/main/pr-N-<sha>`), asi que
            // nunca hay un Issue estable que actualizar — y el required check
            // (via `core.setFailed` abajo) YA bloquea el merge. Abrir un Issue
            // por cada intento aqui era exactamente el ruido de esta tarea (11
            // Issues en 3 dias para 1 solo hallazgo subyacente). `eventName` es
            // mas confiable que parsear `context.ref` a mano.
            const isEphemeral = context.eventName === 'pull_request' || context.eventName === 'merge_group';

            // --- Caso 2: fallo la herramienta. NO es lo mismo que "hay secrets".
            if (result === 'tool_error') {
              let err = '';
              try {
                err = fs.readFileSync(path.join(tmp, 'trufflehog.err'), 'utf8').slice(-3000);
              } catch (e) { /* sin stderr */ }
              if (!isEphemeral) {
                const title = `El escaneo de secrets FALLO en ${repo} (branch: ${branch})`;
                const body = [
                  '## El escaneo de secrets no pudo completarse',
                  '',
                  '**Esto NO significa que se hayan encontrado secrets.** Significa que el escaneo',
                  'no corrio, asi que **no sabemos** si los hay. Hay que arreglar el escaneo.',
                  '',
                  `**Repositorio:** \`${owner}/${repo}\``,
                  `**Branch:** \`${branch}\``,
                  `**Commit:** [${sha}](${commitUrl})`,
                  `**Run:** ${runUrl}`,
                  `**Exit code de TruffleHog:** \`${process.env.SCAN_EXIT}\``,
                  '',
                  '### Salida de error',
                  '',
                  '```',
                  err || '(sin stderr capturado)',
                  '```',
                ].join('\n');
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['security', 'ci'],
                });
              } else {
                await core.summary
                  .addHeading('El escaneo de secrets fallo (sin Issue — rama efimera)')
                  .addRaw(
                    `Exit code de TruffleHog: \`${process.env.SCAN_EXIT}\`. No se abre Issue por ser ` +
                    `un run de \`${context.eventName}\`; el required check ya bloquea el merge.\n\n` +
                    '```\n' + (err || '(sin stderr capturado)') + '\n```'
                  )
                  .write();
              }
              core.setFailed(`El escaneo de secrets fallo con exit ${process.env.SCAN_EXIT}`);
              return;
            }

            // --- Caso 1: hay hallazgos. Reportar QUE y DONDE.
            let raw = '';
            try {
              raw = fs.readFileSync(path.join(tmp, 'trufflehog.jsonl'), 'utf8');
            } catch (e) { /* sin archivo */ }

            const findings = raw.split('\n')
              .map(l => l.trim()).filter(Boolean)
              .map(l => { try { return JSON.parse(l); } catch (e) { return null; } })
              .filter(Boolean);

            // Defensa: exit 183 pero cero hallazgos parseables = no gritar (no
            // hay nada verificable que mostrar, tampoco se falla el check).
            if (findings.length === 0) {
              core.warning('TruffleHog salio 183 pero no se pudo parsear ningun hallazgo. No se abre Issue.');
              return;
            }

            // Nunca pegar el secreto completo en un Issue.
            const redact = (s) => {
              if (!s) return '(vacio)';
              const t = String(s);
              if (t.length <= 12) return `${t.slice(0, 2)}${'*'.repeat(6)}`;
              return `${t.slice(0, 4)}${'*'.repeat(8)}${t.slice(-4)}`;
            };

            const rows = findings.map(f => {
              const g = (f.SourceMetadata && f.SourceMetadata.Data && f.SourceMetadata.Data.Git) || {};
              const fsm = (f.SourceMetadata && f.SourceMetadata.Data && f.SourceMetadata.Data.Filesystem) || {};
              return {
                detector: f.DetectorName || 'desconocido',
                verified: f.Verified === true,
                file: g.file || fsm.file || '(desconocido)',
                line: (g.line !== undefined ? g.line : (fsm.line !== undefined ? fsm.line : '?')),
                commit: g.commit ? String(g.commit).substring(0, 8) : '-',
                redacted: redact(f.Raw),
              };
            });

            const verifiedCount = rows.filter(r => r.verified).length;

            const detail = [
              '| # | Detector | Verificado | Archivo | Linea | Commit | Coincidencia (redactada) |',
              '|---|---|:---:|---|---:|---|---|',
              ...rows.map((r, i) =>
                `| ${i + 1} | \`${r.detector}\` | ${r.verified ? 'si' : '-'} | \`${r.file}\` | ${r.line} | \`${r.commit}\` | \`${r.redacted}\` |`),
            ].join('\n');

            // Fingerprint del hallazgo REAL (detector+file+line+commit), no del
            // titulo. El titulo anterior incluia la rama, y en Merge Queue/PR la
            // rama es distinta en cada intento — asi el dedup nunca coincidia
            // entre corridas aunque el hallazgo subyacente fuera el mismo (root
            // cause de esta tarea). El fingerprint se ordena para que el mismo
            // conjunto de hallazgos produzca el mismo hash sin importar el orden
            // en que TruffleHog los reporte.
            const fingerprintInput = rows
              .map(r => `${r.detector}|${r.file}|${r.line}|${r.commit}`)
              .sort()
              .join('\n');
            const fingerprint = crypto.createHash('sha256').update(fingerprintInput).digest('hex').slice(0, 16);
            const fingerprintMarker = `<!-- secret-scan-fingerprint: ${fingerprint} -->`;

            if (isEphemeral) {
              // El required check (via `core.setFailed` abajo) YA bloquea el
              // merge y el detalle queda en el Job Summary de este run — abrir
              // un Issue por cada intento de PR/merge-queue seria el mismo
              // ruido que origino esta tarea.
              await core.summary
                .addHeading(`Secrets detectados (${findings.length} hallazgo(s), ${verifiedCount} verificado(s))`)
                .addRaw(`Sin Issue — run de \`${context.eventName}\`. El required check bloquea el merge.\n\n${detail}`)
                .write();
              core.setFailed(
                `${findings.length} hallazgo(s) de secrets (${verifiedCount} verificado(s)) — ver el Job ` +
                `Summary de este run. No se abre Issue por ser un run de ${context.eventName}.`
              );
              return;
            }

            const title = `Secrets detectados en ${repo} (branch: ${branch})`;

            // Dedup por fingerprint real, buscando en TODOS los Issues abiertos
            // con label `secrets` — no por titulo exacto (que dependia de la
            // rama y por eso nunca dedupeaba entre corridas de PR/merge-queue).
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'security,secrets', per_page: 50,
            });
            const duplicate = existing.data.find(i => i.body && i.body.includes(fingerprintMarker));
            if (duplicate) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: duplicate.number,
                body: [
                  `Nuevo escaneo con el MISMO hallazgo (fingerprint identico) — commit [${sha}](${commitUrl}), branch \`${branch}\`:`, '',
                  detail, '', `Run: ${runUrl}`,
                ].join('\n'),
              });
              core.setFailed(`${findings.length} hallazgo(s) — ya reportado en Issue #${duplicate.number} (comentario agregado)`);
              return;
            }

            for (const label of ['security', 'secrets']) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: label,
                  color: label === 'security' ? 'd73a4a' : 'fbca04',
                });
              } catch (e) { /* ya existe */ }
            }

            const lines = [
              '## Secrets detectados por TruffleHog',
              '',
              `**${findings.length} hallazgo(s)**, de los cuales **${verifiedCount} verificado(s)**.`,
              '',
              `**Repositorio:** \`${owner}/${repo}\``,
              `**Branch:** \`${branch}\``,
              `**Commit que disparo el escaneo:** [${sha}](${commitUrl})`,
              `**Run:** ${runUrl}`,
              '',
              '### Que se detecto y donde',
              '',
              detail,
              '',
              '> **El commit que disparo el escaneo no es necesariamente el que introdujo el',
              '> hallazgo.** El escaneo cubre **todo el historial** del repo (`fetch-depth: 0`).',
              '> Mira la columna **Commit** de la tabla para saber de donde viene cada uno.',
              '',
              '### Que hacer',
              '',
              '1. **Confirmar que es real.** Revisa la coincidencia y el archivo. Si es un falso',
              '   positivo, agrega el detector a `exclude_detectors` **con la razon escrita** en',
              '   `FaroNovaCorp/.github/.github/workflows/secret-scan.yml`.',
              '2. **Si es real: rotar primero**, asumiendo que esta comprometido.',
              '3. **Eliminar del codigo** — la credencial va a AWS Secrets Manager.',
              '4. **Limpiar el historial** si corresponde (consultar con el CTO).',
              '5. **Cerrar este Issue** cuando este rotado y eliminado.',
              '',
              '### Referencia',
              '',
              '- Estandar de secrets: `Certainty/CLAUDE.md`, seccion Secrets y API Keys',
              '- Los secrets viven en AWS Secrets Manager, nunca en codigo',
              '',
              fingerprintMarker,
              '---',
              '*Detectado por [TruffleHog](https://github.com/trufflesecurity/trufflehog) via GitHub Actions*',
            ];

            const issue = await github.rest.issues.create({
              owner, repo, title, body: lines.join('\n'), labels: ['security', 'secrets'],
            });
            core.setFailed(`${findings.length} hallazgo(s) — Issue abierto: ${issue.data.html_url}`);

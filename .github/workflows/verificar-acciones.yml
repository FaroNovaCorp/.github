name: verificar-acciones

# P-1047 (SHP2) · defensa contra commits impostores en `uses:`.
# - Ataque: `dueño/repo@<sha>` resuelve también un commit que solo vive en un
#   fork (la red de forks comparte objetos). Caso Trivy, mar-2026. El pin por
#   SHA obligatorio de la org no lo frena.
# - Lo exige el ruleset de org «verificar-acciones-p1047», fijado por sha de
#   este archivo: corre en todo PR y en la cola de todo repo con flujo de PR.
#   Cambiar este archivo no cambia el check hasta que un owner mueva ese sha.
# - Regla `workflows` de rulesets: ignora filtros `paths`, corre siempre. Por
#   eso el filtro va adentro: PR sin workflows ni action.yml cambiados → verde
#   en segundos, sin instalar nada.
# - Bloquea solo pares acción@SHA nuevos del PR. Lo que ya estaba en main se
#   avisa aquí y lo detecta la revisión semanal de /cambios-criticos.
# - Nunca hace checkout ni ejecuta código del PR: lee el diff por API.
# - Sin `concurrency`/`cancel-in-progress`: la doc de rulesets lo desaconseja.
# Plan: docs/planes-de-trabajo/pendientes/proteccion-commits-impostores/plan.md
# Tests: python3 -m unittest discover -s .github/tests -p 'test_*.py'

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verificar acciones
        shell: python3 -I {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          """Verifica que todo `uses:` nuevo del PR salga de una rama del repo dueño.

          Por cada par acción@SHA que el PR agrega a un workflow o action.yml:
          - SHA completo de 40 caracteres.
          - El commit existe en el repo dueño y es alcanzable desde una RAMA
            suya (rama por defecto primero, luego releases). Solo-fork
            (impostor) o solo-tag (tag movido fuera de la historia) → rojo.
          - Reusables propios (FaroNovaCorp/*): en la rama por defecto.
          - Comentario de versión: el tag que nombra apunta a ese SHA. Terceros
            sin versión → rojo.
          - El par aparece literal en una línea añadida (corta escapes YAML,
            alias y multilínea que esconden el valor real).
          - zizmor (--no-config --no-ignores): impostor-commit y
            ref-version-mismatch en línea añadida → rojo; en línea previa o si
            zizmor no puede leer el archivo → aviso (la verificación propia
            cubre lo mismo).
          """
          import base64
          import difflib
          import glob
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          ORG = "faronovacorp"
          SHA_RE = re.compile(r"[0-9a-f]{40}")
          USES_RE = re.compile(
              r"([A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)/([A-Za-z0-9._-]+)((?:/[^@\s]+)?)@([^@\s]+)"
          )
          # Versión en el comentario: `v7`, `v7.0.1`, `7.0.1`, `tag=v7.0.1`,
          # `v1.2.3-rc.1`. Un número suelto (`P-144`, `#19`) no es versión.
          VER_RE = re.compile(
              r"(?:^|[\s=@(:])((?:v\d+(?:\.\d+)*|\d+(?:\.\d+)+)(?:-[0-9A-Za-z][0-9A-Za-z.]*)?)(?![\w.-])"
          )
          AUDITORIAS = ("impostor-commit", "ref-version-mismatch")
          MAX_RAMAS = 40
          TMP = os.environ.get("RUNNER_TEMP") or tempfile.gettempdir()
          VENV = os.path.join(TMP, "verificar-acciones-venv")
          # Versiones fijas por hash (pip --require-hashes). zizmor: wheel
          # manylinux x86_64 (runner ubuntu-24.04). PyYAML: cp312, cp313, cp314.
          REQUISITOS = (
              "zizmor==1.32.0"
              " --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071\n"
              "pyyaml==6.0.3"
              " --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc"
              " --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6"
              " --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5\n"
          )


          class ErrorApi(Exception):
              pass


          # ---------------------------------------------------------------- API

          def _pedir(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "faronova-verificar-acciones",
              })
              for intento in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.status, r.read(), r.headers
                  except urllib.error.HTTPError as e:
                      if e.code in (404, 409, 422):
                          return e.code, b"", e.headers
                      espera = e.headers.get("Retry-After")
                      if e.code >= 500 or (e.code in (403, 429) and espera):
                          time.sleep(min(int(espera or 2 ** intento), 30))
                          continue
                      raise ErrorApi(f"HTTP {e.code} en {url}") from None
                  except (urllib.error.URLError, TimeoutError):
                      time.sleep(2 ** intento)
              raise ErrorApi(f"sin respuesta de {url}")


          def api(ruta):
              st, cuerpo, _ = _pedir(f"{API}/{ruta}")
              return st, (json.loads(cuerpo) if st == 200 and cuerpo else None)


          def api_paginado(ruta, tope=1000):
              url, items = f"{API}/{ruta}", []
              while url and len(items) < tope:
                  st, cuerpo, cab = _pedir(url)
                  if st != 200:
                      raise ErrorApi(f"HTTP {st} en {url}")
                  items += json.loads(cuerpo)
                  m = re.search(r'<([^>]+)>;\s*rel="next"', cab.get("Link") or "")
                  url = m.group(1) if m else None
              return items


          # ---------------------------------------------------- qué cambió el PR

          def es_relevante(ruta):
              r = ruta.lower()
              if r.rsplit("/", 1)[-1] in ("action.yml", "action.yaml"):
                  return True
              return (r.startswith(".github/workflows/") and r.count("/") == 2
                      and r.endswith((".yml", ".yaml")))


          def shas_del_evento():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
                  ev = json.load(f)
              nombre = os.environ["GITHUB_EVENT_NAME"]
              if nombre in ("pull_request", "pull_request_target"):
                  return ev["pull_request"]["base"]["sha"], ev["pull_request"]["head"]["sha"]
              if nombre == "merge_group":
                  return ev["merge_group"]["base_sha"], ev["merge_group"]["head_sha"]
              raise ErrorApi(f"evento no soportado: {nombre}")


          def arbol(repo, sha):
              st, d = api(f"repos/{repo}/git/trees/{sha}?recursive=1")
              if st != 200:
                  raise ErrorApi(f"no se pudo leer el árbol {sha[:12]} (HTTP {st})")
              if d.get("truncated"):
                  raise ErrorApi(f"árbol {sha[:12]} truncado por GitHub: no se puede listar completo")
              return {e["path"]: e["sha"] for e in d["tree"]
                      if e["type"] == "blob" and es_relevante(e["path"])}


          def detectar(repo, base, head):
              """Archivos relevantes nuevos o modificados de base a head."""
              ab, ah = arbol(repo, base), arbol(repo, head)
              return [{"ruta": p, "base": ab.get(p), "head": s}
                      for p, s in sorted(ah.items()) if ab.get(p) != s]


          def blob(repo, sha):
              st, d = api(f"repos/{repo}/git/blobs/{sha}")
              if st != 200:
                  raise ErrorApi(f"no se pudo leer el blob {sha[:12]} (HTTP {st})")
              return base64.b64decode(d["content"]).decode("utf-8")


          # ------------------------------------------------ lectura del archivo

          def lineas_nuevas(base_txt, head_txt):
              a, b = base_txt.splitlines(), head_txt.splitlines()
              nuevas = set()
              sm = difflib.SequenceMatcher(None, a, b, autojunk=False)
              for tag, _i1, _i2, j1, j2 in sm.get_opcodes():
                  if tag in ("replace", "insert"):
                      nuevas.update(range(j1 + 1, j2 + 1))
              return nuevas


          def usos(doc):
              """Todos los valores de claves `uses`, en cualquier nivel."""
              out, vistos, pila = [], set(), [doc]
              while pila:
                  n = pila.pop()
                  if id(n) in vistos:
                      continue
                  vistos.add(id(n))
                  if isinstance(n, dict):
                      for k, v in n.items():
                          if k == "uses":
                              out.append(v)
                          pila.append(v)
                  elif isinstance(n, list):
                      pila.extend(n)
              return out


          def aparece(uso, linea):
              return re.search(r"(?<![\w./-])" + re.escape(uso) + r"(?![\w./@-])", linea) is not None


          def comentario(linea, uso):
              m = re.search(r"(?<![\w./-])" + re.escape(uso) + r"(?![\w./@-])", linea)
              resto = linea[m.end():] if m else ""
              c = re.search(r"(?:^|\s)#\s*(.*)$", resto.lstrip("'\""))
              return c.group(1).strip() if c else ""


          # ------------------------------------------------------- verificación

          class Verificador:
              def __init__(self):
                  self._alcance = {}
                  self._tags = {}

              def contiene(self, repo, rama, sha):
                  st, d = api(f"repos/{repo}/compare/{urllib.parse.quote(rama, safe='/')}...{sha}?per_page=1")
                  return st == 200 and d.get("status") in ("behind", "identical")

              def alcanzable(self, dueno, repo, sha):
                  clave = (dueno.lower(), repo.lower(), sha)
                  if clave not in self._alcance:
                      self._alcance[clave] = self._alcanzable(dueno, repo, sha)
                  return self._alcance[clave]

              def _alcanzable(self, dueno, repo, sha):
                  st, info = api(f"repos/{dueno}/{repo}")
                  if st != 200:
                      return f"no se pudo leer el repo {dueno}/{repo} (HTTP {st}): sin verificar no entra"
                  full, rama_def = info["full_name"], info["default_branch"]
                  st, _ = api(f"repos/{full}/commits/{sha}")
                  if st != 200:
                      return f"el commit {sha[:12]} no existe en {full}"
                  if self.contiene(full, rama_def, sha):
                      return None
                  if info["owner"]["login"].lower() == ORG:
                      return (f"reusable propio fuera de `{rama_def}`: solo entra código ya "
                              f"mergeado en {full}")
                  ramas = [r for r in api_paginado(f"repos/{full}/branches?per_page=100")
                           if r["name"] != rama_def]
                  ramas.sort(key=lambda r: (
                      0 if re.match(r"(releases?[/-]|v\d)", r["name"]) else
                      1 if r["name"] in ("main", "master", "develop") else 2, r["name"]))
                  if any(r["commit"]["sha"] == sha for r in ramas):
                      return None
                  for r in ramas[:MAX_RAMAS]:
                      if self.contiene(full, r["name"], sha):
                          return None
                  extra = (f" (revisadas {MAX_RAMAS} de {len(ramas)} ramas)"
                           if len(ramas) > MAX_RAMAS else "")
                  return (f"el commit {sha[:12]} no está en ninguna rama de {full}{extra}: "
                          f"commit de un fork (impostor) o tag movido fuera de la historia")

              def tag_commit(self, full, tag):
                  clave = (full.lower(), tag)
                  if clave in self._tags:
                      return self._tags[clave]
                  res = None
                  st, d = api(f"repos/{full}/git/ref/tags/{urllib.parse.quote(tag)}")
                  obj = d["object"] if st == 200 else None
                  for _ in range(5):
                      if not obj:
                          break
                      if obj["type"] == "commit":
                          res = obj["sha"]
                          break
                      if obj["type"] != "tag":
                          break
                      st, d = api(f"repos/{full}/git/tags/{obj['sha']}")
                      obj = d["object"] if st == 200 else None
                  self._tags[clave] = res
                  return res

              def version(self, dueno, repo, sha, texto):
                  m = VER_RE.search(texto or "")
                  if not m:
                      if dueno.lower() == ORG:
                          return None
                      return ("sin versión en el comentario: escribe `# vX.Y.Z` con el tag "
                              "que apunta a ese SHA")
                  v = m.group(1)
                  full = f"{dueno}/{repo}"
                  for tag in (v, v[1:] if v.startswith("v") else "v" + v):
                      t = self.tag_commit(full, tag)
                      if t is not None:
                          if t == sha:
                              return None
                          return f"el comentario dice {tag}, pero {tag} apunta a {t[:12]}, no a {sha[:12]}"
                  return f"el comentario dice {v}, pero ese tag no existe en {full}"

              def revisar_uso(self, ruta, uso, lineas):
                  n0 = lineas[0][0]
                  if uso.startswith(("./", "$/")):
                      return []
                  if uso.startswith("docker://"):
                      if "@sha256:" in uso:
                          return []
                      return [hallazgo("aviso", ruta, n0, uso,
                                       "imagen docker sin digest @sha256: (fuera de este check)")]
                  m = USES_RE.fullmatch(uso)
                  if not m:
                      return [hallazgo("error", ruta, n0, uso, "forma de `uses` no reconocida")]
                  dueno, repo, _sub, ref = m.groups()
                  if not SHA_RE.fullmatch(ref):
                      return [hallazgo("error", ruta, n0, uso,
                                       f"no está fijado por SHA completo (`@{ref}`)")]
                  out = []
                  motivo = self.alcanzable(dueno, repo, ref)
                  if motivo:
                      out.append(hallazgo("error", ruta, n0, uso, motivo))
                  for n, linea in lineas:
                      motivo = self.version(dueno, repo, ref, comentario(linea, uso))
                      if motivo:
                          out.append(hallazgo("error", ruta, n, uso, motivo))
                  return out


          def hallazgo(nivel, ruta, linea, uso, motivo):
              return {"nivel": nivel, "ruta": ruta, "linea": linea, "uso": uso, "motivo": motivo}


          def revisar_archivo(ruta, base_txt, head_txt, verif):
              import yaml
              try:
                  doc = yaml.safe_load(head_txt)
              except yaml.YAMLError as e:
                  marca = getattr(e, "problem_mark", None)
                  return [hallazgo("error", ruta, marca.line + 1 if marca else None, None,
                                   f"YAML que no se puede leer: {getattr(e, 'problem', None) or e}")]
              try:
                  previos = {u for u in usos(yaml.safe_load(base_txt)) if isinstance(u, str)} if base_txt else set()
              except yaml.YAMLError:
                  previos = set()
              lineas = head_txt.splitlines()
              nuevas = sorted(lineas_nuevas(base_txt, head_txt))
              out, vistos = [], set()
              for uso in usos(doc):
                  if not isinstance(uso, str):
                      out.append(hallazgo("error", ruta, None, None, "`uses` que no es texto"))
                      continue
                  if uso in previos or uso in vistos:
                      continue
                  vistos.add(uso)
                  donde = [(n, lineas[n - 1]) for n in nuevas if aparece(uso, lineas[n - 1])]
                  if not donde:
                      out.append(hallazgo("error", ruta, None, uso,
                                          "uso nuevo que no aparece literal en una línea añadida "
                                          "(escape, alias o multilínea): escríbelo en una sola línea"))
                      continue
                  out += verif.revisar_uso(ruta, uso, donde)
              return out


          # ------------------------------------------------------------- zizmor

          def instalar():
              subprocess.run([sys.executable, "-m", "venv", VENV], check=True)
              req = os.path.join(TMP, "verificar-acciones-requisitos.txt")
              with open(req, "w", encoding="utf-8") as f:
                  f.write(REQUISITOS)
              subprocess.run([os.path.join(VENV, "bin", "pip"), "install", "--quiet",
                              "--disable-pip-version-check", "--no-deps", "--only-binary", ":all:",
                              "--require-hashes", "-r", req], check=True)
              sys.path.insert(0, glob.glob(os.path.join(VENV, "lib", "python3*", "site-packages"))[0])


          def correr_zizmor(archivo):
              """Lista de (auditoría, fila_ini, fila_fin, descripción), o None si zizmor falla."""
              r = subprocess.run(
                  [os.path.join(VENV, "bin", "zizmor"), "--no-config", "--no-ignores", "--no-progress",
                   "--no-exit-codes", "--format", "json",
                   "--cache-dir", os.path.join(TMP, "verificar-acciones-zizmor-cache"), archivo],
                  capture_output=True, text=True, timeout=300)
              if r.returncode != 0:
                  return None
              out = []
              for f in json.loads(r.stdout or "[]"):
                  if f.get("ident") not in AUDITORIAS:
                      continue
                  for loc in f.get("locations", []):
                      if (loc.get("symbolic") or {}).get("kind", "Primary") != "Primary":
                          continue
                      c = loc["concrete"]["location"]
                      out.append((f["ident"], c["start_point"]["row"] + 1,
                                  c["end_point"]["row"] + 1, f.get("desc", "")))
              return out


          def revisar_zizmor(ruta, base_txt, head_txt, carpeta):
              destino = os.path.join(carpeta, ruta)
              os.makedirs(os.path.dirname(destino), exist_ok=True)
              with open(destino, "w", encoding="utf-8") as f:
                  f.write(head_txt)
              res = correr_zizmor(destino)
              if res is None:
                  return [hallazgo("aviso", ruta, None, None,
                                   "zizmor no pudo auditar el archivo; la verificación propia lo cubrió")]
              nuevas = lineas_nuevas(base_txt, head_txt)
              out = []
              for ident, ini, fin, desc in res:
                  nuevo = any(n in nuevas for n in range(ini, fin + 1))
                  out.append(hallazgo("error" if nuevo else "aviso", ruta, ini, None,
                                      f"zizmor {ident}: {desc}" + ("" if nuevo else " (ya estaba en la base)")))
              return out


          # ------------------------------------------------------------- salida

          def _dato(t):
              return str(t).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def _prop(t):
              return _dato(t).replace(":", "%3A").replace(",", "%2C")


          def _celda(t):
              return re.sub(r"[`|\r\n]", " ", str(t))


          def informar(hallazgos, cambios):
              for h in hallazgos:
                  tipo = "error" if h["nivel"] == "error" else "warning"
                  props = f"file={_prop(h['ruta'])}" + (f",line={h['linea']}" if h["linea"] else "")
                  texto = (f"`{_celda(h['uso'])}`: " if h["uso"] else "") + h["motivo"]
                  print(f"::{tipo} {props},title=verificar-acciones::{_dato(texto)}")
              errores = sum(h["nivel"] == "error" for h in hallazgos)
              filas = [f"| {'❌' if h['nivel'] == 'error' else '⚠️'} | {_celda(h['ruta'])}:{h['linea'] or '-'} "
                       f"| `{_celda(h['uso'] or '-')}` | {_celda(h['motivo'])} |" for h in hallazgos]
              lineas = [f"## verificar-acciones — {'ROJO' if errores else 'VERDE'}", "",
                        f"Archivos revisados: {len(cambios)} · errores: {errores} · "
                        f"avisos: {len(hallazgos) - errores}", ""]
              if filas:
                  lineas += ["| | Archivo | uses | Motivo |", "|---|---|---|---|", *filas]
              resumen("\n".join(lineas))
              return errores


          def resumen(texto):
              # Ninguna línea empieza con `::`: el texto del PR va en celdas `| … |`.
              print(texto)
              destino = os.environ.get("GITHUB_STEP_SUMMARY")
              if destino:
                  with open(destino, "a", encoding="utf-8") as f:
                      f.write(texto + "\n")


          def main():
              repo = os.environ["GITHUB_REPOSITORY"]
              try:
                  base, head = shas_del_evento()
                  cambios = detectar(repo, base, head)
                  if not cambios:
                      resumen("## verificar-acciones — VERDE\n\nSin cambios en workflows ni en action.yml.")
                      return 0
                  instalar()
                  verif, hallazgos = Verificador(), []
                  with tempfile.TemporaryDirectory() as carpeta:
                      for c in cambios:
                          try:
                              head_txt = blob(repo, c["head"])
                              base_txt = blob(repo, c["base"]) if c["base"] else ""
                          except UnicodeDecodeError:
                              hallazgos.append(hallazgo("error", c["ruta"], None, None, "archivo que no es UTF-8"))
                              continue
                          hallazgos += revisar_archivo(c["ruta"], base_txt, head_txt, verif)
                          hallazgos += revisar_zizmor(c["ruta"], base_txt, head_txt, carpeta)
                  return 1 if informar(hallazgos, cambios) else 0
              except (ErrorApi, subprocess.CalledProcessError, subprocess.TimeoutExpired) as e:
                  print(f"::error title=verificar-acciones::{_dato(f'no se pudo verificar, sin verificar no entra: {e}')}")
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
